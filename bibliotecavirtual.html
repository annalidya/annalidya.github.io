<html>
<head>
<style>
ul {
  list-style-type: none;
  margin: 0;
  padding: 0;
  width: 200px;
  background-color: #f0ebaa;
}

li a {
  display: block;
  color: black;
  padding: 8px 16px;
  text-decoration: none;
}

/* Change the link and background color on hover */
li a:hover {
  background-color: #555555;
  color: rgb(243, 245, 157);
}
</style>
</head>
<body>

<ul>
  <li><a href="#Livro 1">Livro 1</a></li>
  <li><a href="#Livro 2">Livro 2</a></li>
  <li><a href="#Livro 3">Livro 3</a></li>
</ul>
